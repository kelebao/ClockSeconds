name: 功能建议（Feature Request）
description: 提出新功能或改进建议。
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题？
      description: 简洁描述痛点或使用场景
      placeholder: 我希望浮窗能自定义字体大小……
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望模块怎么做？
      placeholder: 在设置页增加「浮窗字号」滑块
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / 参考资料
      description: 其它思路、类似模块的做法、截图等
    validations:
      required: false
  - type: dropdown
    id: device_scope
    attributes:
      label: 影响范围
      description: 这个功能主要服务于哪类用户？
      options:
        - 仅 ColorOS / OPPO / 一加
        - 多厂商通用
        - 不确定
    validations:
      required: false
