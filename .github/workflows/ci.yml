name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ubuntu-latest 已预装 Android SDK；不再用 android-actions/setup-android@v3
      # （该 action 会执行 sdkmanager "tools"，而 tools 包已从 SDK 仓库移除 → 直接失败）。
      - name: Locate preinstalled Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -d "$SDK" ]; then
            echo "::error::Android SDK not found at $SDK"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "Using SDK: $SDK"
          ls "$SDK/platforms" || true

      - name: Accept SDK licenses & install platform
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMGR="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
            "$SDKMGR" "platforms;android-35" "build-tools;35.0.0" >/dev/null 2>&1 || true
          fi
          ls "$SDK/platforms" || true

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      # CI 无本地签名 secrets → 走 unsigned 路径（build.gradle.kts 的 hasReleaseSigning 判断），
      # 构建仍成功；此步用于尽早发现 release 变体的打包/资源/lintVital 问题。
      - name: Assemble release (unsigned in CI)
        run: ./gradlew assembleRelease --no-daemon

      - name: i18n consistency check
        run: python3 tools/check_i18n.py
